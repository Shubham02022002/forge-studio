services:
  - type: web
    name: forge-studio-api
    runtime: node
    plan: free
    region: ohio
    branch: main
    rootDir: apps/server
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "2"
      - key: WEB_APP_URL
        value: https://forge-studio-kappa.vercel.app
      - key: GITHUB_CALLBACK_URL
        value: https://forge-studio-kappa.vercel.app/api/auth/github/callback
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
